name: Publish PixelPlayer v2.4.1

on:
  push:
    tags:
      - v2.4.1

permissions:
  contents: write

concurrency:
  group: release-v2.4.1
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android and Linux assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Android and desktop distributions
        run: >-
          java -classpath gradle/wrapper/gradle-wrapper.jar
          org.gradle.wrapper.GradleWrapperMain
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8"
          --no-daemon
          --no-parallel
          --no-configuration-cache
          :app:assembleRelease
          :desktopApp:createDistributable

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
            release/PixelPlayer-Android-v2.4.1.apk
          tar -C desktopApp/build/compose/binaries/main/app -czf \
            release/PixelPlayer-Desktop-v2.4.1-linux-x64.tar.gz \
            pixelplayer-desktop
          cd release
          sha256sum PixelPlayer-Android-v2.4.1.apk \
            PixelPlayer-Desktop-v2.4.1-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.4.1 \
            release/PixelPlayer-Android-v2.4.1.apk \
            release/PixelPlayer-Desktop-v2.4.1-linux-x64.tar.gz \
            release/SHA256SUMS.txt \
            --verify-tag \
            --title "PixelPlayer Plus v2.4.1" \
            --notes-file RELEASE_NOTES_v2.4.1.md
